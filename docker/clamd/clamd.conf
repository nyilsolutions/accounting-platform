# clamd for the API's upload scans (ADR 0012, 0030), in the clamd image. It listens only on the
# task's localhost, where the API container reaches it (CLAMD_HOST=127.0.0.1).
Foreground yes
TCPSocket 3310
TCPAddr 127.0.0.1
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
LogTime yes
LogClean no
# Reload the signatures within 10 minutes of freshclam changing them.
SelfCheck 600
# The API's largest upload: MAX_UPLOAD_MB allows up to 100.
StreamMaxLength 100M
MaxThreads 12
ReadTimeout 120
