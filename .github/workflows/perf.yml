name: Performance

# The full performance run (ADR 0028): a company of 100,000 transactions and 5,000 customers,
# against the API as its own process. Nightly and on demand; every pull request runs the same
# suite at smoke scale in CI.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: perf
  cancel-in-progress: false

# Least privilege: the jobs only read the code. Actions are pinned to commits (Dependabot
# updates them).
permissions:
  contents: read

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/acct_dev
      APP_DB_PASSWORD: ci_app_password
      TURBO_TELEMETRY_DISABLED: '1'
      PERF_SCALE: full
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm db:setup
      - name: Performance at 100,000 transactions
        run: pnpm --filter @acct/api perf
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: perf-results
          path: apps/api/perf/results
          retention-days: 30
