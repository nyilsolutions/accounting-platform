name: Performance

# The full performance run (ADR 0028): a company of 100,000 transactions and 5,000 customers,
# against the API as its own process. Nightly and on demand; every pull request runs the same
# suite at smoke scale in CI.
on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

concurrency:
  group: perf
  cancel-in-progress: false

jobs:
  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/acct_dev
      APP_DB_PASSWORD: ci_app_password
      TURBO_TELEMETRY_DISABLED: '1'
      PERF_SCALE: full
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm db:setup
      - name: Performance at 100,000 transactions
        run: pnpm --filter @acct/api perf
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perf-results
          path: apps/api/perf/results
          retention-days: 30
