name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/acct_dev
      APP_DB_PASSWORD: ci_app_password
      NEXT_TELEMETRY_DISABLED: '1'
      TURBO_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm build
      - name: Create database roles and databases
        run: pnpm db:setup
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Unit and integration tests (real Postgres, RLS enforced)
        run: pnpm test
      - name: Install Playwright browser
        run: pnpm --filter @acct/web exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  # The QuickBooks Desktop migration agent (Phase 6, apps/desktop-agent): its logic is tested on
  # Linux; the Windows wizard is built on Windows and published as a single-file executable.
  agent:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test the agent's core
        run: dotnet test apps/desktop-agent/QbMigrationAgent.sln

  agent-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish the agent (win-x86, self-contained, single file)
        run: dotnet publish apps/desktop-agent/src/QbMigrationAgent.Windows -c Release -p:PublishSingleFile=true -o agent-publish
      - uses: actions/upload-artifact@v4
        with:
          name: qb-migration-agent-unsigned
          path: agent-publish/QbMigrationAgent.exe
          retention-days: 14
