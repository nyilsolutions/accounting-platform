# Dependency updates (ADR 0029). Security updates are opened as soon as an advisory appears;
# version updates come weekly, grouped so one pull request carries the minor and patch bumps.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
  # The Node base image in the Dockerfile (pinned by digest).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directory: /apps/desktop-agent
    schedule:
      interval: weekly
    groups:
      nuget:
        patterns: ['*']
